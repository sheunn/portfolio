<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}김시은 Portfolio{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="cursor-reticle" aria-hidden="true">
        <span class="cursor-line horizontal"></span>
        <span class="cursor-line vertical"></span>
        <span class="cursor-coordinates">x: 0, y: 0</span>
    </div>

    <header class="site-header">
        <nav class="nav container" aria-label="주요 메뉴">
            <a class="brand" href="{{ url_for('home') }}">KIM_SIEUN<span>.PORTFOLIO</span></a>
            <div class="nav-links">
                <a href="{{ url_for('home') }}" class="scan-hover scan-hover-nav {% if request.endpoint == 'home' %}active{% endif %}">Home</a>
                <a href="{{ url_for('skills') }}" class="scan-hover scan-hover-nav {% if request.endpoint == 'skills' %}active{% endif %}">Skills</a>
                <a href="{{ url_for('experience_list') }}" class="scan-hover scan-hover-nav {% if request.endpoint in ['experience_list', 'experience_detail'] %}active{% endif %}">Experience</a>
                <a href="{{ url_for('project_list') }}" class="scan-hover scan-hover-nav {% if request.endpoint in ['project_list', 'project_detail'] %}active{% endif %}">Projects</a>
            </div>
        </nav>
    </header>

    <main class="container page-shell">
        {% block content %}
        {% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/cursor.js') }}" defer></script>
</body>
</html>
