<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}김시은 Portfolio{% endblock %}</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <nav class="nav container" aria-label="주요 메뉴">
            <a class="brand" href="{{ url_for('home') }}">Kim Sieun</a>
            <div class="nav-links">
                <a href="{{ url_for('home') }}" class="{% if request.endpoint == 'home' %}active{% endif %}">Home</a>
                <a href="{{ url_for('about') }}" class="{% if request.endpoint == 'about' %}active{% endif %}">About</a>
                <a href="{{ url_for('skills') }}" class="{% if request.endpoint == 'skills' %}active{% endif %}">Skills</a>
                <a href="{{ url_for('project_list') }}" class="{% if request.endpoint in ['project_list', 'project_detail'] %}active{% endif %}">Projects</a>
            </div>
        </nav>
    </header>

    <main class="container page-shell">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
